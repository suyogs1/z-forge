[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "tools"]

[project]
name = "zforge-mcp"
version = "0.1.0"
description = "Z-FORGE MCP server — exposes Z-FORGE tools to IBM Bob"
requires-python = ">=3.11"
dependencies = [
    "zforge-engine",
    "mcp>=1.0",
]

[tool.uv.sources]
zforge-engine = { workspace = true }

[project.scripts]
zforge-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.9",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
