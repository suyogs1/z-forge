[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zforge"]

[project]
name = "zforge-engine"
version = "0.1.0"
description = "Z-FORGE core analysis and change engine"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "networkx>=3.2",
    "pydantic>=2.5",
]

[project.scripts]
zforge-demo = "zforge.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.9",
    "mypy>=1.8",
]
afp = [
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
